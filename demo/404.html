<body>
  <div class="error-container">
    <div class="error-icon text-primary animate__animated animate__bounceIn">
      <i class="ph-bold ph-ghost"></i>
    </div>
    <div class="error-code error-404 animate__animated animate__fadeInUp">404</div>
    <h1 class="error-title animate__animated animate__fadeInUp" style="animation-delay: 100ms;">Page Not Found</h1>
    <p class="error-text animate__animated animate__fadeInUp" style="animation-delay: 200ms;">

    </p>

    <div class="card bg-light border-0 text-start mx-auto mb-4 animate__animated animate__fadeInUp"

      <div class="card-body p-3 font-monospace small text-muted text-break">
        <div class="fw-semibold text-dark mb-1">Error Details:</div>
        <div><span class="text-danger">Code:</span> ERR_HTTP_404_NOT_FOUND</div>
        <div><span class="text-danger">Path:</span> /demo/unknown-page.html</div>
        <div><span class="text-danger">Req ID:</span> req_a1b2c3d4e5</div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3 animate__animated animate__fadeInUp" style="animation-delay: 300ms;">
        <a href="index.html" class="btn btn-primary btn-lg shadow-sm">

        </a>
        <a href="index.html" class="btn btn-light btn-lg shadow-sm">
            <i class="ph-bold ph-arrow-left me-2"></i>Go Back
