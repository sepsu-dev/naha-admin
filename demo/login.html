<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Meta SEO -->
    <meta name="description" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta name="keywords" content="NahaAdmin, admin dashboard, bootstrap 5, ui kit, webapp" />
    <meta name="author" content="NahaAdmin" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta property="og:description" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta property="og:type" content="website" />
    <title>NahaAdmin - Login</title>
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../assets/plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/styles/naha-admin.min.css" />
    <link rel="stylesheet" href="../assets/plugins/phosphor/bold/style.css" />
    <link rel="stylesheet" href="../assets/styles/pages/login.css" />
</head>

<body>
    <div class="container">
        <div class="card login-card">
            <div class="login-header">
                <div class="icon-box">
                    <i class="ph-bold ph-lock"></i>
                </div>
                <h1>Welcome Back</h1>
                <p class="mb-0 text-muted">Login form example</p>
            </div>
            <div class="login-body">
                <p class="small text-muted">Demo only. Use sample details; no sign-in request is sent.</p>
                <form data-demo-auth>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" autocomplete="username" placeholder="name@example.com" required />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Enter your password" required />
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="ph-bold ph-sign-in me-2" aria-hidden="true"></i>Try Login Form
                    </button>
                    <p class="small text-muted" role="status" aria-live="polite"></p>
                    <p class="text-center small"><a href="index.html">Browse dashboard demo</a></p>
                    <p class="text-center text-muted mb-0">
                        Don't have an account? <a href="register.html" class="text-decoration-none">Create one</a>
                    </p>
                </form>
            </div>
        </div>
    </div>


    <script src="../assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scripts/pages/auth-demo.js"></script>
</body>

</html>
