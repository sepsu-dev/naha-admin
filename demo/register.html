<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Meta SEO -->
    <meta name="description" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta name="keywords" content="NahaAdmin, admin dashboard, bootstrap 5, ui kit, webapp" />
    <meta name="author" content="NahaAdmin" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta property="og:description" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta property="og:type" content="website" />
    <title>NahaAdmin - Register</title>
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"/>
    <link rel="stylesheet" href="../assets/plugins/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../assets/styles/naha-admin.min.css"/>
    <link rel="stylesheet" href="../assets/plugins/phosphor/bold/style.css"/>
    <link rel="stylesheet" href="../assets/styles/pages/register.css"/>
</head>

<body>
    <div class="container">
        <div class="card register-card">
            <div class="register-header">
                <div class="icon-box">
                    <i class="ph-bold ph-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p class="mb-0 text-muted">Registration form example</p>
            </div>
            <div class="register-body">
                <p class="small text-muted">Demo only. Use sample details; no account is created.</p>
                <form data-demo-auth>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input id="firstName" type="text" class="form-control" autocomplete="given-name" placeholder="Ujang" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input id="lastName" type="text" class="form-control" autocomplete="family-name" placeholder="Kasep" required />
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" class="form-control" autocomplete="email" placeholder="name@example.com" required />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" type="password" class="form-control" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required />
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input id="confirmPassword" type="password" class="form-control" autocomplete="new-password" data-confirm-password placeholder="Confirm password" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="ph-bold ph-user-plus me-2" aria-hidden="true"></i>Try Registration Form
                    </button>
                    <p class="small text-muted" role="status" aria-live="polite"></p>
                    <p class="text-center text-muted mb-0">
                        Already have an account? <a href="login.html" class="text-decoration-none">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    

  <script src="../assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scripts/pages/auth-demo.js"></script>
</body>

</html>
