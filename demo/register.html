<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Meta SEO -->
    <meta name="description" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta name="keywords" content="NahaAdmin, admin dashboard, bootstrap 5, ui kit, webapp" />
    <meta name="author" content="NahaAdmin" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta property="og:description" content="NahaAdmin - Free Bootstrap 5 Admin Dashboard" />
    <meta property="og:type" content="website" />
    <title>NahaAdmin - Register</title>
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"/>
    <link rel="stylesheet" href="../assets/plugins/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="../assets/styles/naha-admin.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css"/>
    <link rel="stylesheet" href="../assets/plugins/animate/animate.min.css"/>
    <link rel="stylesheet" href="../assets/plugins/phosphor/bold/style.css"/>
    <link rel="stylesheet" href="../assets/styles/pages/register.css"/>
</head>

<body>
    <div class="container">
        <div class="card animate__animated animate__fadeIn register-card">
            <div class="register-header">
                <div class="icon-box">
                    <i class="ph-bold ph-user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p class="mb-0 text-muted">Join us today to get started</p>
            </div>
            <div class="register-body">
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="John" />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" placeholder="Doe" />
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="name@example.com" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Create a password" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="Confirm password" />
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terms">
                        <label class="form-check-label" for="terms">I agree to the <a href="#">Terms of
                                Service</a></label>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 mb-3">
                        <i class="ph-bold ph-user-plus me-2"></i>Create Account
                    </button>
                    <p class="text-center text-muted mb-0">
                        Already have an account? <a href="login.html" class="text-decoration-none">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <!-- Donate QRIS Modal -->
  <div class="modal fade" id="donateModal" tabindex="-1" aria-labelledby="donateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
        <div class="modal-header bg-light border-0 py-3">
          <h5 class="modal-title fw-bold text-dark d-flex align-items-center" id="donateModalLabel">
            <i class="ph-bold ph-heart text-danger me-2"></i> Support NahaAdmin
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center p-4">
          <p class="text-muted extra-small mb-3">Scan the QRIS code below to donate. Your support means a lot for the development of this template!</p>
          <div class="bg-light p-3 rounded-3 border d-inline-block mb-2">
            <img src="../assets/images/qris.jpeg" alt="QRIS Donation" class="img-fluid rounded-3" style="max-width: 280px; height: auto; display: block; margin: 0 auto;" />
          </div>
          <div class="mt-2 text-muted fw-semibold" style="font-size: 0.8rem;">
            <span>QRIS GPN - Merchant</span>
          </div>
        </div>
        <div class="modal-footer border-0 bg-light py-2">
          <button type="button" class="btn btn-sm btn-outline-secondary w-100 fw-bold" data-bs-dismiss="modal" style="border-radius: 10px;">Close</button>
        </div>
      </div>
    </div>

  <script src="../assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scripts/pages/register.js"></script>
</body>

</html>
