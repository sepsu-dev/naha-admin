<body>
    <div class="container">
        <div class="card forgot-card">
            <div class="forgot-header">
                <div class="icon-box">
                    <i class="ph-bold ph-key"></i>
                </div>
                <h1>Forgot Password?</h1>
                <p class="mb-0 text-muted">Password reset form example</p>
            </div>
            <div class="forgot-body">
                <p class="text-muted mb-4">Demo only. Use a sample email address; no reset email is sent.
                </p>
                <form data-demo-auth>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input id="email" type="email" class="form-control" autocomplete="email" placeholder="name@example.com" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="ph-bold ph-paper-plane-tilt me-2" aria-hidden="true"></i>Try Reset Form
                    </button>
                    <p class="small text-muted" role="status" aria-live="polite"></p>
                    <p class="text-center text-muted mb-0">
                        Remember your password? <a href="login.html" class="text-decoration-none">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

  <script src="../assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../assets/scripts/custom.js"></script>
</body>
